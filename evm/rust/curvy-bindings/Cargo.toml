[package]
name = "curvy-bindings"
version = "0.1.0-rc.2"
description = "Alloy bindings and local deployment helpers for Curvy v2 contracts"
edition = "2024"
authors = ["Curvy"]
repository = "https://github.com/0xCurvy/contracts"
documentation = "https://docs.rs/curvy-bindings"
readme = "README.md"
rust-version = "1.91"
license = "GPL-3.0-only"
publish = true
include = [
    "src/**",
    "README.md",
    "LICENSE*",
    "THIRD_PARTY_NOTICES.md",
    "artifact-manifest.json",
]

# Detached crate: the surrounding monorepo is a JS workspace; never let a future
# parent Cargo workspace capture this crate.
[workspace]

[dependencies]
anyhow = "1"
alloy = { version = "2.1", default-features = false, features = [
    "essentials",
    "json-rpc",
    "contract",
    "k256",
    "std",
] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_with = "3"
tracing = "0.1"

[dev-dependencies]
# `node-bindings` (anvil) is only needed by the deploy tests, so it stays out of the
# dependency set consumers compile.
alloy = { version = "2.1", default-features = false, features = ["node-bindings"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
